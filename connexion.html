<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<meta name="application-name" content="DAKPRO ÉLITE">
<title>DAKPRO ÉLITE | Connexion Acheteur</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:20px;}
.box{width:100%;max-width:480px;padding:30px 25px;background:#12161f;border:2px solid #d4af37;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);}

/* LOGO FIXE / INAMOVIBLE */
.logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 15px;
  width: 100%;
  height: 75px;
}
.logo{
  display:block;
  width:75px;
  height:75px;
  min-width:75px;
  min-height:75px;
  border-radius:50%;
  border:2px solid #d4af37;
  object-fit:cover;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), 0 2px 4px rgba(212,175,55,0.2);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
  user-select: none;
  pointer-events: none;
}

h1{text-align:center;font-size:22px;color:#d4af37;margin-bottom:6px;}
.subtitle{text-align:center;color:#e0e0e0;font-size:13px;line-height:1.5;margin-bottom:20px;}
label{display:block;font-size:12px;color:#ddd;margin-bottom:6px;}
input{width:100%;padding:13px;border:1px solid #444;border-radius:9px;background:#000;color:#fff;outline:none;font-size:14px;}
input:focus{border-color:#d4af37;}
.field{margin-bottom:14px;}
.password-box{position:relative;}
.password-box input{padding-right:50px;}
.toggle-password{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:transparent;color:#d4af37;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
button.submit{width:100%;padding:13px;border:none;border-radius:9px;background:#d4af37;color:#000;font-weight:bold;cursor:pointer;font-size:14px;margin-top:10px;}
button.submit:disabled{opacity:.6;cursor:not-allowed;}

/* OPTIONS SUPPLÉMENTAIRES TOUT EN BAS */
.extra-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin: 12px 0;
}
.extra-actions a {
  color: #d4af37;
  text-decoration: none;
}
.extra-actions a:hover {
  text-decoration: underline;
}

/* BOUTON GOOGLE */
.btn-google{
  width:100%;
  padding:12px;
  border:1px solid #444;
  border-radius:9px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  transition:background 0.2s, border-color 0.2s;
}
.btn-google:hover{
  background:#f1f1f1;
  border-color:#d4af37;
}
.btn-google:disabled{
  opacity:0.7;
  cursor:not-allowed;
}
.btn-google img{
  width:18px;
  height:18px;
}

.divider{
  display:flex;
  align-items:center;
  text-align:center;
  color:#777;
  font-size:11px;
  margin:18px 0;
}
.divider::before, .divider::after{
  content:'';
  flex:1;
  border-bottom:1px solid #333;
}
.divider::before{margin-right:.75em;}
.divider::after{margin-left:.75em;}

.message{margin-top:15px;padding:10px;border-radius:8px;font-size:12px;display:none;text-align:center;line-height:1.5;}
.error{background:#351313;color:#ff8585;}
.success{background:#12351d;color:#70e090;}
.links{margin-top:20px;text-align:center;font-size:12px;}
.links a{color:#d4af37;text-decoration:none;}
.links div{margin-top:10px;}
</style>
</head>
<body>
<div class="box">
<div class="logo-container">
  <img class="logo" src="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png" alt="DAKPRO ÉLITE">
</div>
<h1>DAKPRO ÉLITE</h1>
<p class="subtitle">Connectez-vous à votre compte Acheteur pour accéder à votre espace d'achat.</p>

<form id="loginForm">
<div class="field">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="email" required maxlength="150" placeholder="Votre adresse e-mail">
</div>

<div class="field">
<label for="password">Mot de passe</label>
<div class="password-box">
<input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128" placeholder="Votre mot de passe">
<button type="button" class="toggle-password" data-target="password" aria-label="Afficher le mot de passe">👁️</button>
</div>
</div>

<div class="extra-actions">
  <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:#aaa;">
    <input type="checkbox" id="rememberMe" checked style="width:14px;height:14px;accent-color:#d4af37;cursor:pointer;"> Se souvenir de moi
  </label>
  <a href="#" id="forgotPasswordLink">Mot de passe oublié ?</a>
</div>

<button id="loginButton" class="submit" type="submit">Se connecter</button>
</form>

<div class="divider">OU</div>

<!-- BOUTON CONTINUER AVEC GOOGLE PLACÉ EN BAS -->
<button type="button" id="googleLoginBtn" class="btn-google">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
  Continuer avec Google
</button>

<div id="message" class="message"></div>

<div class="links">
<div>Vous n'avez pas encore de compte ? <a id="registerLink" href="inscription.html">S'inscrire</a></div>
<div><a href="index.html">← Retour à l'accueil</a></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
  authDomain: "dakproelite.firebaseapp.com",
  databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
  projectId: "dakproelite",
  storageBucket: "dakproelite.firebasestorage.app",
  messagingSenderId: "580591769206",
  appId: "1:580591769206:web:859724d4b2dbf904087157"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.useDeviceLanguage();
const db = getDatabase(app);

// Préparer le fournisseur Google dès le chargement
const googleProvider = new GoogleAuthProvider();
googleProvider.addScope("email");
googleProvider.addScope("profile");
googleProvider.setCustomParameters({
  prompt: "select_account"
});

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const googleBtn = document.getElementById("googleLoginBtn");
const rememberMeCheckbox = document.getElementById("rememberMe");
const emailInputEl = document.getElementById("email");
const message = document.getElementById("message");
const forgotPasswordLink = document.getElementById("forgotPasswordLink");
const registerLink = document.getElementById("registerLink");

const urlParams = new URLSearchParams(window.location.search);
const rawRedirect = urlParams.get("redirect");
const redirectTarget = (rawRedirect && !/^https?:\/\//i.test(rawRedirect)) ? rawRedirect : "index.html";

if (registerLink && rawRedirect && !/^https?:\/\//i.test(rawRedirect)) {
  registerLink.href = `inscription.html?redirect=${encodeURIComponent(rawRedirect)}`;
}

// Restaurer l'e-mail mémorisé si "Se souvenir de moi" avait été coché
try {
  const savedEmail = localStorage.getItem("dakpro_remember_email");
  if (savedEmail && emailInputEl && !emailInputEl.value) {
    emailInputEl.value = savedEmail;
  }
} catch (_) {}

setPersistence(auth, browserLocalPersistence).catch(() => {});

const GOOGLE_BTN_HTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo"> Continuer avec Google`;

function resetGoogleBtn() {
  googleBtn.disabled = false;
  googleBtn.innerHTML = GOOGLE_BTN_HTML;
}

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

function isEmbeddedInAppBrowser() {
  const ua = navigator.userAgent || navigator.vendor || "";
  return /(FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok|Snapchat|Twitter|WhatsApp)/i.test(ua);
}

async function ensureOrCheckUserProfile(user, isGoogle = false) {
  if (!user) return { allowed: false, reason: "Utilisateur introuvable." };

  const userRef = ref(db, "users/" + user.uid);
  const snapshot = await get(userRef);
  const now = Date.now();

  if (snapshot.exists()) {
    const userData = snapshot.val() || {};
    if (userData.actif === false) {
      return { allowed: false, reason: "Votre compte a été désactivé." };
    }
    try {
      await update(userRef, { updatedAt: now });
    } catch (_) {}
    return { allowed: true };
  }

  if (isGoogle) {
    const userData = {
      uid: user.uid,
      nom: user.displayName || (user.email ? user.email.split("@")[0] : "Acheteur Google"),
      email: user.email || "",
      photoURL: user.photoURL || "",
      telephone: user.phoneNumber || "",
      indicatif: "+229",
      role: "acheteur",
      provider: "google",
      actif: true,
      createdAt: now,
      updatedAt: now
    };
    await set(userRef, userData);
  }

  return { allowed: true };
}

document.querySelectorAll(".toggle-password").forEach(buttonToggle => {
  buttonToggle.addEventListener("click", () => {
    const input = document.getElementById(buttonToggle.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
    buttonToggle.textContent = input.type === "password" ? "👁️" : "🙈";
  });
});

let isHandlingAuth = false;

// 1. Récupérer le résultat si l'utilisateur revient d'une redirection Google
getRedirectResult(auth)
  .then(async result => {
    if (result && result.user) {
      isHandlingAuth = true;
      googleBtn.disabled = true;
      googleBtn.textContent = "Finalisation avec Google...";
      const check = await ensureOrCheckUserProfile(result.user, true);
      if (!check.allowed) {
        isHandlingAuth = false;
        showMessage(check.reason || "Connexion refusée.");
        resetGoogleBtn();
        return;
      }
      showMessage("Connexion réussie avec Google !", "success");
      window.location.replace(redirectTarget);
    }
  })
  .catch(error => {
    console.error("Erreur retour Google Redirect :", error);
    if (error && error.code === "auth/unauthorized-domain") {
      showMessage(`Domaine non autorisé dans Firebase (${window.location.hostname}). Ajoutez-le dans Authentication > Settings > Authorized domains.`);
    } else if (error && error.code !== "auth/popup-closed-by-user") {
      showMessage("Impossible de finaliser la connexion Google (" + (error.code || "erreur") + ").");
    }
    resetGoogleBtn();
  });

// 2. Si l'utilisateur est déjà connecté, le rediriger proprement
onAuthStateChanged(auth, async user => {
  if (!user || isHandlingAuth) return;
  isHandlingAuth = true;
  try {
    const check = await ensureOrCheckUserProfile(user, false);
    if (!check.allowed) {
      isHandlingAuth = false;
      showMessage(check.reason || "Connexion refusée.");
      return;
    }
  } catch (e) {
    console.warn("Vérification profil :", e);
  }
  window.location.replace(redirectTarget);
});

// --- GESTION MOT DE PASSE OUBLIÉ ---
forgotPasswordLink.addEventListener("click", async (e) => {
  e.preventDefault();
  const emailVal = emailInputEl ? emailInputEl.value.trim().toLowerCase() : "";
  if (!emailVal) {
    showMessage("Veuillez saisir votre adresse e-mail d'abord pour réinitialiser le mot de passe.");
    emailInputEl?.focus();
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
    showMessage("Veuillez saisir une adresse e-mail valide.");
    emailInputEl?.focus();
    return;
  }

  forgotPasswordLink.style.pointerEvents = "none";
  forgotPasswordLink.style.opacity = "0.6";
  message.style.display = "none";

  try {
    await sendPasswordResetEmail(auth, emailVal);
    showMessage("Un e-mail de réinitialisation de mot de passe a été envoyé à " + emailVal + ". Vérifiez aussi vos spams.", "success");
  } catch (error) {
    console.error("Erreur reset password:", error);
    let errText = "Impossible d'envoyer l'e-mail de réinitialisation. Vérifiez l'adresse.";
    if (error.code === "auth/user-not-found") errText = "Aucun compte trouvé avec cette adresse e-mail.";
    else if (error.code === "auth/invalid-email") errText = "Format d'adresse e-mail invalide.";
    else if (error.code === "auth/too-many-requests") errText = "Trop de demandes. Réessayez plus tard.";
    showMessage(errText);
  } finally {
    forgotPasswordLink.style.pointerEvents = "";
    forgotPasswordLink.style.opacity = "";
  }
});

// --- CONNEXION AVEC GOOGLE ---
googleBtn.addEventListener("click", async () => {
  if (isEmbeddedInAppBrowser()) {
    showMessage("Google bloque la connexion dans les navigateurs intégrés (WhatsApp, Facebook, TikTok). Ouvrez cette page dans Chrome ou Safari.");
    return;
  }

  message.style.display = "none";
  googleBtn.disabled = true;
  googleBtn.textContent = "Ouverture de Google...";

  try {
    // Appel immédiat dans le gestionnaire de clic pour éviter le blocage popup
    const result = await signInWithPopup(auth, googleProvider);
    isHandlingAuth = true;

    const check = await ensureOrCheckUserProfile(result.user, true);
    if (!check.allowed) {
      isHandlingAuth = false;
      showMessage(check.reason || "Connexion refusée.");
      resetGoogleBtn();
      return;
    }

    showMessage("Connexion réussie avec Google !", "success");
    window.location.replace(redirectTarget);
  } catch (error) {
    console.error("Erreur Google Popup :", error);
    const code = error && error.code ? error.code : "";

    if (
      code === "auth/popup-blocked" ||
      code === "auth/operation-not-supported-in-this-environment" ||
      code === "auth/cancelled-popup-request"
    ) {
      googleBtn.textContent = "Redirection vers Google...";
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (redirectError) {
        console.error("Erreur Google Redirect :", redirectError);
        showMessage("Impossible d'ouvrir la page Google. Réessayez dans Chrome ou Safari.");
        resetGoogleBtn();
        return;
      }
    }

    if (code === "auth/popup-closed-by-user") {
      showMessage("La fenêtre Google a été fermée avant la sélection du compte. Si elle se ferme toute seule, vérifiez que le domaine (" + window.location.hostname + ") est autorisé dans Firebase.");
    } else if (code === "auth/unauthorized-domain") {
      showMessage("Domaine non autorisé dans Firebase (" + window.location.hostname + "). Ajoutez-le dans Authentication > Settings > Authorized domains.");
    } else if (code === "auth/network-request-failed") {
      showMessage("Erreur réseau. Vérifiez votre connexion Internet et réessayez.");
    } else {
      showMessage("Erreur Google : " + (code || "Impossible de se connecter avec Google."));
    }

    resetGoogleBtn();
  }
});

// --- SOUMISSION DU FORMULAIRE DE CONNEXION CLASSIQUE ---
form.addEventListener("submit", async event => {
  event.preventDefault();

  const email = emailInputEl ? emailInputEl.value.trim().toLowerCase() : "";
  const password = document.getElementById("password").value;
  const keepSession = rememberMeCheckbox ? rememberMeCheckbox.checked : true;

  if (!email || !password) {
    showMessage("Veuillez remplir tous les champs obligatoires.");
    return;
  }

  button.disabled = true;
  button.textContent = "Connexion en cours...";
  message.style.display = "none";

  try {
    await setPersistence(auth, keepSession ? browserLocalPersistence : browserSessionPersistence);

    try {
      if (keepSession) {
        localStorage.setItem("dakpro_remember_email", email);
      } else {
        localStorage.removeItem("dakpro_remember_email");
      }
    } catch (_) {}

    isHandlingAuth = true;
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const check = await ensureOrCheckUserProfile(user, false);
    if (!check.allowed) {
      isHandlingAuth = false;
      showMessage(check.reason || "Connexion refusée.");
      button.disabled = false;
      button.textContent = "Se connecter";
      return;
    }

    showMessage("Connexion réussie !", "success");

    setTimeout(() => {
      window.location.replace(redirectTarget);
    }, 500);

  } catch (error) {
    isHandlingAuth = false;
    console.error("Erreur de connexion :", error);
    let text = "Adresse e-mail ou mot de passe incorrect.";
    if (error.code === "auth/user-not-found" || error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
      text = "Identifiants incorrects.";
    } else if (error.code === "auth/too-many-requests") {
      text = "Trop de tentatives échouées. Réessayez plus tard.";
    }
    showMessage(text);
    button.disabled = false;
    button.textContent = "Se connecter";
  }
});
</script>
</body>
</html>
