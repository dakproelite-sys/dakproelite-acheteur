<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<meta name="application-name" content="DAKPRO ÉLITE">
<title>DAKPRO ÉLITE | Connexion Acheteur</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:20px;}
.box{width:100%;max-width:480px;padding:30px 25px;background:#12161f;border:2px solid #d4af37;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);}

/* LOGO FIXE / INAMOVIBLE */
.logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 15px;
  width: 100%;
  height: 75px;
}
.logo{
  display:block;
  width:75px;
  height:75px;
  min-width:75px;
  min-height:75px;
  border-radius:50%;
  border:2px solid #d4af37;
  object-fit:cover;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), 0 2px 4px rgba(212,175,55,0.2);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
  user-select: none;
  pointer-events: none;
}

h1{text-align:center;font-size:22px;color:#d4af37;margin-bottom:6px;}
.subtitle{text-align:center;color:#e0e0e0;font-size:13px;line-height:1.5;margin-bottom:20px;}
label{display:block;font-size:12px;color:#ddd;margin-bottom:6px;}
input{width:100%;padding:13px;border:1px solid #444;border-radius:9px;background:#000;color:#fff;outline:none;font-size:14px;}
input:focus{border-color:#d4af37;}
.field{margin-bottom:14px;}
.password-box{position:relative;}
.password-box input{padding-right:50px;}
.toggle-password{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:transparent;color:#d4af37;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
button.submit{width:100%;padding:13px;border:none;border-radius:9px;background:#d4af37;color:#000;font-weight:bold;cursor:pointer;font-size:14px;margin-top:10px;}
button.submit:disabled{opacity:.6;cursor:not-allowed;}

/* OPTIONS SUPPLÉMENTAIRES TOUT EN BAS */
.extra-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin: 12px 0;
}
.extra-actions a {
  color: #d4af37;
  text-decoration: none;
}
.extra-actions a:hover {
  text-decoration: underline;
}

/* BOUTON GOOGLE */
.btn-google{
  width:100%;
  padding:12px;
  border:1px solid #444;
  border-radius:9px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  transition:background 0.2s, border-color 0.2s;
}
.btn-google:hover{
  background:#f1f1f1;
  border-color:#d4af37;
}
.btn-google img{
  width:18px;
  height:18px;
}

.divider{
  display:flex;
  align-items:center;
  text-align:center;
  color:#777;
  font-size:11px;
  margin:18px 0;
}
.divider::before, .divider::after{
  content:'';
  flex:1;
  border-bottom:1px solid #333;
}
.divider::before{margin-right:.75em;}
.divider::after{margin-left:.75em;}

.message{margin-top:15px;padding:10px;border-radius:8px;font-size:12px;display:none;text-align:center;line-height:1.5;}
.error{background:#351313;color:#ff8585;}
.success{background:#12351d;color:#70e090;}
.links{margin-top:20px;text-align:center;font-size:12px;}
.links a{color:#d4af37;text-decoration:none;}
.links div{margin-top:10px;}
</style>
</head>
<body>
<div class="box">
<div class="logo-container">
  <img class="logo" src="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png" alt="DAKPRO ÉLITE">
</div>
<h1>DAKPRO ÉLITE</h1>
<p class="subtitle">Connectez-vous à votre compte Acheteur pour accéder à votre espace d'achat.</p>

<form id="loginForm">
<div class="field">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="email" required maxlength="150" placeholder="Votre adresse e-mail">
</div>

<div class="field">
<label for="password">Mot de passe</label>
<div class="password-box">
<input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128" placeholder="Votre mot de passe">
<button type="button" class="toggle-password" data-target="password" aria-label="Afficher le mot de passe">👁️</button>
</div>
</div>

<div class="extra-actions">
  <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:#aaa;">
    <input type="checkbox" id="rememberMe" style="width:14px;height:14px;accent-color:#d4af37;cursor:pointer;"> Se souvenir de moi
  </label>
  <a href="#" id="forgotPasswordLink">Mot de passe oublié ?</a>
</div>

<button id="loginButton" class="submit" type="submit">Se connecter</button>
</form>

<div class="divider">OU</div>

<!-- BOUTON CONTINUER AVEC GOOGLE PLACÉ EN BAS -->
<button type="button" id="googleLoginBtn" class="btn-google">
  <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
  Continuer avec Google
</button>

<div id="message" class="message"></div>

<div class="links">
<div>Vous n'avez pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
<div><a href="index.html">← Retour à l'accueil</a></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
  authDomain: "dakproelite.firebaseapp.com",
  databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
  projectId: "dakproelite",
  storageBucket: "dakproelite.firebasestorage.app",
  messagingSenderId: "580591769206",
  appId: "1:580591769206:web:859724d4b2dbf904087157"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const googleBtn = document.getElementById("googleLoginBtn");
const message = document.getElementById("message");
const forgotPasswordLink = document.getElementById("forgotPasswordLink");

const redirectTarget = "index.html";

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

document.querySelectorAll(".toggle-password").forEach(buttonToggle => {
  buttonToggle.addEventListener("click", () => {
    const input = document.getElementById(buttonToggle.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
    buttonToggle.textContent = input.type === "password" ? "👁️" : "🙈";
  });
});

let pageAlreadyLoaded = false;
onAuthStateChanged(auth, user => {
  if (pageAlreadyLoaded) return;
  pageAlreadyLoaded = true;
  if (user) {
    window.location.replace(redirectTarget);
  }
});

// --- GESTION MOT DE PASSE OUBLIÉ ---
forgotPasswordLink.addEventListener("click", async (e) => {
  e.preventDefault();
  const emailInput = document.getElementById("email").value.trim().toLowerCase();
  if (!emailInput) {
    showMessage("Veuillez saisir votre adresse e-mail d'abord pour réinitialiser le mot de passe.");
    return;
  }
  
  try {
    await sendPasswordResetEmail(auth, emailInput);
    showMessage("Un e-mail de réinitialisation de mot de passe a été envoyé à votre adresse.", "success");
  } catch (error) {
    console.error("Erreur reset password:", error);
    showMessage("Impossible d'envoyer l'e-mail de réinitialisation. Vérifiez l'adresse.");
  }
});

// --- CONNEXION AVEC GOOGLE ---
googleBtn.addEventListener("click", async () => {
  googleBtn.disabled = true;
  googleBtn.textContent = "Connexion avec Google...";
  message.style.display = "none";

  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userRef = ref(db, "users/" + user.uid);
    const snapshot = await get(userRef);

    if (!snapshot.exists()) {
      const now = Date.now();
      const userData = {
        uid: user.uid,
        nom: user.displayName || "Acheteur Google",
        email: user.email,
        telephone: user.phoneNumber || "",
        indicatif: "+229",
        role: "acheteur",
        actif: true,
        createdAt: now,
        updatedAt: now
      };
      await set(userRef, userData);
    }

    showMessage("Connexion réussie avec Google !", "success");
    setTimeout(() => {
      window.location.replace(redirectTarget);
    }, 700);

  } catch (error) {
    console.error("Erreur Google Auth :", error);
    showMessage("Impossible de se connecter avec Google.");
    googleBtn.disabled = false;
    googleBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo"> Continuer avec Google`;
  }
});

// --- SOUMISSION DU FORMULAIRE DE CONNEXION CLASSIQUE ---
form.addEventListener("submit", async event => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Veuillez remplir tous les champs obligatoires.");
    return;
  }

  button.disabled = true;
  button.textContent = "Connexion en cours...";
  message.style.display = "none";

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const userRef = ref(db, "users/" + user.uid);
    const snapshot = await get(userRef);

    if (snapshot.exists()) {
      const userData = snapshot.val();
      if (userData.actif === false) {
        showMessage("Votre compte a été désactivé.");
        button.disabled = false;
        button.textContent = "Se connecter";
        return;
      }
    }

    showMessage("Connexion réussie !", "success");

    setTimeout(() => {
      window.location.replace(redirectTarget);
    }, 700);

  } catch (error) {
    console.error("Erreur de connexion :", error);
    let text = "Adresse e-mail ou mot de passe incorrect.";
    if (error.code === "auth/user-not-found" || error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
      text = "Identifiants incorrects.";
    } else if (error.code === "auth/too-many-requests") {
      text = "Trop de tentatives échouées. Réessayez plus tard.";
    }
    showMessage(text);
    button.disabled = false;
    button.textContent = "Se connecter";
  }
});
</script>
</body>
</html>
