<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection en cours...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(
                circle at center,
                #18202e 0%,
                #080a0f 45%,
                #000 100%
            );
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .redirect-box {
            width: 90%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            background: #12161f;
            border: 2px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(212,175,55,.20);
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 25px auto;
            border-radius: 50%;
            border: 4px solid #333;
            border-top-color: #d4af37;
            animation: tourner 1s linear infinite;
        }

        #message {
            color: #d4af37;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.5;
        }

        .btn-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #f3e5ab;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
        }

        .btn-secondary:hover {
            background: #d4af37;
            color: #000;
        }

        @keyframes tourner {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="redirect-box">
        <p id="message">Vérification de l'authentification...</p>

        <div class="loader" id="loader"></div>

        <div class="btn-group" id="btnGroup">
            <a href="inscription.html" class="btn">📝 Créer un compte</a>
            <a href="connexion.html" class="btn btn-secondary">🔐 Se connecter</a>
        </div>
    </div>

    <!-- FIREBASE AUTHENTICATION + REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
            authDomain: "dakproelite.firebaseapp.com",
            databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
            projectId: "dakproelite",
            storageBucket: "dakproelite.firebasestorage.app",
            messagingSenderId: "580591769206",
            appId: "1:580591769206:web:859724d4b2dbf904087157"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const message = document.getElementById("message");
        const loader = document.getElementById("loader");
        const btnGroup = document.getElementById("btnGroup");

        function afficherOptionErreur(texte) {
            message.textContent = texte;
            loader.style.display = "none";
            btnGroup.style.display = "flex";
        }

        // REDIRECTION AUTOMATIQUE SELON AUTH & USER ROLE
        onAuthStateChanged(auth, async (user) => {

            // 1. UTILISATEUR NON CONNECTÉ -> REDIRECTION INSCRIPTION
            if (!user) {
                message.textContent = "Redirection vers la page d'inscription...";
                setTimeout(() => {
                    window.location.replace("inscription.html");
                }, 500);
                return;
            }

            // 2. UTILISATEUR CONNECTÉ -> LECTURE DANS USER / REALTIME DATABASE
            message.textContent = "Analyse de votre profil...";

            try {
                const userRef = ref(db, "users/" + user.uid);
                const snapshot = await get(userRef);

                // Si le profil n'existe pas encore dans la DB, envoi vers le profil acheteur par défaut
                if (!snapshot.exists()) {
                    message.textContent = "Profil en cours de création, redirection...";
                    window.location.replace("profil-acheteur.html");
                    return;
                }

                const userData = snapshot.val();
                const role = String(userData.role || "").trim().toLowerCase();

                // ORIENTATION SELON LE RÔLE DÉTECTÉ DANS LA BASE
                if (role === "admin" || userData.isAdmin === true) {
                    message.textContent = "Accès à l'administration...";
                    window.location.replace("administration.html");
                    return;
                }

                if (role === "vendeur") {
                    message.textContent = "Accès à l'espace vendeur...";
                    window.location.replace("vendeur.html");
                    return;
                }

                if (role === "livreur") {
                    message.textContent = "Accès à l'espace livreur...";
                    window.location.replace("livreur.html");
                    return;
                }

                // ROLE ACHETEUR OU DEFAUT -> PROFIL ACHETEUR
                message.textContent = "Accès à votre espace acheteur...";
                window.location.replace("profil-acheteur.html");

            } catch (error) {
                console.error("Erreur lors de la redirection :", error);
                afficherOptionErreur("Impossible de charger le profil. Veuillez choisir une option :");
            }
        });
    </script>
</body>
</html>
