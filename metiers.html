let currentLang = localStorage.getItem("dakpro_lang") || "fr";

function setLanguage(lang) {
  if(!translations[lang]) return;
  currentLang = lang;
  localStorage.setItem("dakpro_lang", lang);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(translations[lang][key]) el.textContent = translations[lang][key];
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if(translations[lang][key]) el.placeholder = translations[lang][key];
  });

  const langLabel = document.getElementById("currentLangLabel");
  if(langLabel) langLabel.textContent = translations[lang].name;

  buildCategories();
  filterMetiers();
}

document.addEventListener("DOMContentLoaded", () => {
  const mainBtn = document.getElementById("langMainBtn");
  const menu = document.getElementById("langMenu");

  mainBtn?.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("show");
  });

  document.addEventListener("click", () => {
    menu?.classList.remove("show");
  });

  document.querySelectorAll(".lang-option").forEach(btn => {
    btn.addEventListener("click", () => {
      setLanguage(btn.dataset.lang);
      menu?.classList.remove("show");
    });
  });

  setLanguage(currentLang);
  
  if(window.allMetiersData.length > 0){
    buildCategories();
    filterMetiers();
  }
});

onAuthStateChanged(auth, user => {
  currentUser = user;
});

function loadMetiers(){
  onValue(ref(db, "metiers_publications"), snapshot=>{
    const data = snapshot.val();
    if(!data){
      loadFallbackPublications();
      return;
    }
    window.allMetiersData = Object.entries(data)
      .map(([id, item])=>({ id, ...item }))
      .filter(item => item && item.actif !== false);

    try {
      localStorage.setItem("dakpro_cached_metiers", JSON.stringify(window.allMetiersData));
    } catch(e) {}

    buildCategories();
    filterMetiers();
  }, error=>{
    console.error("Erreur Firebase:", error);
    document.getElementById("products").innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#dc2626; font-size:12px;">Erreur d'accès à la base de données.</div>`;
  });
}

function loadFallbackPublications(){
  onValue(ref(db, "publications"), snapshot=>{
    const data = snapshot.val();
    if(!data){ renderList([]); return; }

    window.allMetiersData = Object.entries(data)
      .map(([id, item])=>({ id, ...item }))
      .filter(item => item && item.actif !== false);

    buildCategories();
    filterMetiers();
  });
}

function buildCategories(){
  const uniqueCats = [...new Set(window.allMetiersData.map(p=> p.categorie).filter(Boolean))];
  const t = translations[currentLang];
  const categories = [t.allCategory, ...uniqueCats];
  const menu = document.getElementById("catMenu");
  if(!menu) return;

  if(!categories.includes(currentCat)){
    currentCat = t.allCategory;
  }

  menu.innerHTML = categories.map(cat => `
    <button type="button" class="cat-btn ${cat === currentCat ? "active" : ""}" data-cat="${escapeAttribute(cat)}">${escapeHTML(cat)}</button>
  `).join("");

  menu.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentCat = btn.dataset.cat;
      menu.querySelectorAll(".cat-btn").forEach(b=> b.classList.remove("active"));
      btn.classList.add("active");
      filterMetiers();
    });
  });
}

document.getElementById("searchBar")?.addEventListener("input", filterMetiers);

function filterMetiers(){
  const q = (document.getElementById("searchBar")?.value || "").toLowerCase().trim();
  const t = translations[currentLang];
  const filtered = window.allMetiersData.filter(item=>{
    const name = String(item.nom || item.titre || "").toLowerCase();
    const desc = String(item.description || "").toLowerCase();
    const cat = String(item.categorie || "");
    const ville = String(item.ville || "").toLowerCase();

    const matchCat = currentCat === t.allCategory || cat === currentCat;
    const matchQuery = !q || name.includes(q) || desc.includes(q) || cat.toLowerCase().includes(q) || ville.includes(q);
    return matchCat && matchQuery;
  });
  renderList(filtered);
}

function renderList(list){
  const container = document.getElementById("products");
  if(!container) return;
  const t = translations[currentLang];

  if(list.length === 0){
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#64748b; font-size:12px; padding:30px;">Aucun professionnel disponible.</div>`;
    return;
  }

  const uid = auth.currentUser?.uid || "";
  container.innerHTML = list.map(item => {
    const id = encodeURIComponent(item.id || "");
    const siteBase = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
    const affLink = `${siteBase}/metiers.html?id=${id}${uid ? "&ref="+uid : ""}`;
    const img = item.images && item.images.length > 0 ? item.images[0] : (item.image || "https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png");

    const nomAtelier = item.nom || item.titre || "Atelier Professionnel";
    const metierCat = item.categorie || "Artisan";
    const villePays = `${item.ville || "Ville"}, ${item.pays || item.country || "Pays"}`;

    return `
      <article class="card">
        <div class="media-container">
          <img src="${escapeAttribute(img)}" alt="${escapeAttribute(nomAtelier)}" loading="lazy" decoding="async">
        </div>
        <div>
          <div style="margin-bottom:3px;"><span class="tag-express">🛠️ ${escapeHTML(metierCat)}</span></div>
          <h3>${escapeHTML(nomAtelier)}</h3>
          <div style="font-size:10px; color:#b48a00; font-weight:bold; margin-bottom:3px;">📍 ${escapeHTML(villePays)}</div>
          <div class="description-apercu">${escapeHTML(item.description || "Service certifié DAKPROÉLITE.")}</div>
        </div>
        <div>
          <div class="card-actions-row">
            <button type="button" class="btn-action btn-view btn-inspect" data-id="${escapeAttribute(item.id || "")}">${t.viewBtn}</button>
            <button type="button" class="btn-action btn-copy" data-aff="${escapeAttribute(affLink)}">${t.copyBtn}</button>
          </div>
        </div>
      </article>
    `;
  }).join("");

  container.querySelectorAll(".btn-inspect").forEach(btn => {
    btn.addEventListener("click", () => {
      ouvrirFicheProfil(btn.dataset.id);
    });
  });

  container.querySelectorAll(".btn-copy").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try {
        await navigator.clipboard.writeText(btn.dataset.aff);
        const old = btn.textContent;
        btn.textContent = t.copiedMsg;
        setTimeout(()=> btn.textContent = old, 1500);
      } catch(e) {
        console.error("Erreur copie", e);
      }
    });
  });
}

function escapeHTML(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeAttribute(value){ return escapeHTML(value); }

/* =====================================================
GESTION FICHE PROFIL & VÉRIFICATION PASS 4 MOIS
===================================================== */

async function ouvrirFicheProfil(metierId) {
  const metier = window.allMetiersData.find(m => String(m.id) === String(metierId));
  if (!metier) return;

  const t = translations[currentLang];
  const img = metier.images && metier.images.length > 0 ? metier.images[0] : (metier.image || "https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png");

  document.getElementById("modalImg").src = img;
  document.getElementById("modalName").textContent = metier.nom || metier.titre || "Atelier Professionnel";
  document.getElementById("modalCategory").textContent = `🛠️ ${metier.categorie || "Artisan"}`;
  document.getElementById("modalCountryText").textContent = metier.pays || metier.country || "Non spécifié";
  document.getElementById("modalVille").textContent = metier.ville || "Non spécifiée";
  
  // Affichage complet de toute la description tirée de Realtime Database sans troncature
  document.getElementById("modalDescText").textContent = metier.description || "Aucune description détaillée fournie.";

  // Vérifier si l'utilisateur possède un Pass 4 Mois actif
  let passValide = false;
  if (currentUser) {
    const passSnap = await get(ref(db, `users/${currentUser.uid}/pass_metiers`));
    const maintenant = Date.now();
    if (passSnap.exists()) {
      const pass = passSnap.val();
      if (pass.actif && pass.date_expiration > maintenant) {
        passValide = true;
      }
    }
  }

  const contactSection = document.getElementById("contactInfoSection");
  const modalActions = document.getElementById("modalActions");

  if (passValide) {
    // Si le pass est valide, afficher les numéros. Aucun e-mail n'est affiché.
    document.getElementById("modalPhone").textContent = metier.telephone || metier.whatsapp || "Non renseigné";
    document.getElementById("modalWhatsapp").textContent = metier.whatsapp || "Non renseigné";
    contactSection.style.display = "block";

    const numTel = (metier.whatsapp || metier.telephone || "").replace(/[^0-9]/g, '');
    modalActions.innerHTML = `
      <a href="https://wa.me/${numTel}" target="_blank" class="btn-modal-action btn-wa">${t.waBtn}</a>
      <a href="tel:${numTel}" class="btn-modal-action btn-call">${t.callBtn}</a>
    `;
  } else {
    // Si pas de pass valide, cacher les contacts et afficher le bouton FedaPay (Pass 4 Mois - 2 000 FCFA)
    contactSection.style.display = "none";
    modalActions.innerHTML = `
      <button type="button" class="btn-modal-action btn-unlock" onclick="declencherFedaPay('${metier.id}')">${t.unlockBtn}</button>
    `;
  }

  document.getElementById("contactModal").style.display = "flex";
}

window.declencherFedaPay = function(metierId) {
  const t = translations[currentLang];
  if (!currentUser) {
    alert(t.loginAlert);
    window.location.href = "profil-acheteur.html";
    return;
  }

  const confirmPaiement = confirm(t.paymentPrompt);
  if (!confirmPaiement) return;

  let widget = FedaPay.init({
    public_key: 'pk_live_DUGntocyIWTtfHBOvFpPtq54',
    transaction: {
      amount: 2000,
      description: 'Pass 4 Mois Annuaire Métiers DAKPROÉLITE',
      currency: { iso: 'XOF' }
    },
    customer: {
      email: currentUser.email || 'client@dakproelite.com',
      lastname: currentUser.displayName || 'Acheteur DAKPROÉLITE'
    },
    onComplete: async function(response) {
      if (response.reason === FedaPay.DIALOG_DISMISSED) {
        alert(t.paymentCanceled);
        return;
      }
      
      if (response.status === 'approved' || response.transaction?.status === 'approved') {
        const duree4Mois = 120 * 24 * 60 * 60 * 1000; // 120 jours (4 mois)
        const now = Date.now();
        
        await set(ref(db, `users/${currentUser.uid}/pass_metiers`), {
          actif: true,
          date_paiement: now,
          date_expiration: now + duree4Mois,
          transaction_id: response.transaction?.id || "FEDAPAY_OK"
        });

        alert(t.paymentSuccess);
        ouvrirFicheProfil(metierId);
      } else {
        alert(t.paymentFailed);
      }
    }
  });

  widget.open();
};

window.closeContactModal = function() {
  document.getElementById("contactModal").style.display = "none";
};

loadMetiers();
</script>
