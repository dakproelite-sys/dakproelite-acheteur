<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Acheteur VIP - DAKPROÉLITE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0d;
            color: #f5f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(145deg, #161619, #101012);
            border-bottom: 1px solid #2a2a32;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-name {
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
        }
        .badge-acheteur {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: #e74c3c;
            color: #fff;
        }

        /* Conteneur Principal */
        main {
            flex: 1;
            padding: 25px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Grille Responsive */
        .navigation-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        @media(min-width: 768px) {
            .navigation-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media(min-width: 1024px) {
            .navigation-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        /* Cartes de Navigation */
        .nav-card {
            background: linear-gradient(145deg, #161619, #101012);
            border: 1px solid #2a2a32;
            border-radius: 14px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .nav-card:hover, .nav-card.active {
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.25);
            background: linear-gradient(145deg, #1c1c21, #121215);
        }
        .nav-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }
        .nav-name {
            font-size: 13px;
            font-weight: 700;
            color: #f5f5f7;
        }

        /* Zone d'affichage dynamique */
        #dashboard-container {
            background: linear-gradient(145deg, #161619, #101012);
            border: 1px solid #2a2a32;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            min-height: 450px;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #71717a;
            border-top: 1px solid #2a2a32;
            background: #0b0b0d;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <span class="user-name" id="userNameHeader">Chargement...</span>
            <span class="badge-acheteur">Acheteur VIP</span>
        </div>
        <button class="btn-logout" id="btnLogout">🚪 Déconnexion</button>
    </header>

    <main>
        <!-- Grille de navigation -->
        <div class="navigation-grid">
            <div class="nav-card active" data-module="dashboard">
                <div class="nav-icon">📊</div>
                <div class="nav-name">Tableau de Bord</div>
            </div>
            <div class="nav-card" data-module="produits">
                <div class="nav-icon">🛍️</div>
                <div class="nav-name">Catalogue Produits</div>
            </div>
            <div class="nav-card" data-module="paiement">
                <div class="nav-icon">💳</div>
                <div class="nav-name">Paiement Sécurisé</div>
            </div>
            <div class="nav-card" data-module="commandes">
                <div class="nav-icon">📦</div>
                <div class="nav-name">Mes Commandes</div>
            </div>
            <div class="nav-card" data-module="support">
                <div class="nav-icon">💬</div>
                <div class="nav-name">Support Rapide</div>
            </div>
            <div class="nav-card" data-module="profil">
                <div class="nav-icon">👤</div>
                <div class="nav-name">Mon Profil</div>
            </div>
        </div>

        <!-- Conteneur principal d'injection JS -->
        <div id="dashboard-container">
            <div style="text-align: center; padding: 60px 20px; color: #d4af37;">
                <h3>Initialisation de votre espace client...</h3>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Tous droits réservés — DAKPROÉLITE Espace Client Sécurisé
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
            authDomain: "dakproelite.firebaseapp.com",
            databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
            projectId: "dakproelite",
            storageBucket: "dakproelite.firebasestorage.app",
            messagingSenderId: "580591769206",
            appId: "1:580591769206:web:859724d4b2dbf904087157"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserId = null;

        const modulesFiles = {
            'dashboard': './acheteur-dashboard.js',
            'produits': './acheteur-produits.js',
            'paiement': './paiement.js',
            'commandes': './acheteur-commandes.js',
            'support': './support-rapide.js',
            'profil': './acheteur-profil.js'
        };

        // Chargement sécurisé de module
        async function chargerModule(nomModule, elementClique) {
            if (elementClique) {
                document.querySelectorAll('.nav-card').forEach(card => card.classList.remove('active'));
                elementClique.classList.add('active');
            }

            const container = document.getElementById('dashboard-container');
            container.innerHTML = `<div style="text-align: center; padding: 60px 20px; color: #d4af37;">
                <h3>Chargement du module...</h3>
            </div>`;

            const filePath = modulesFiles[nomModule];

            try {
                const module = await import(filePath);
                if (module && typeof module.init === 'function') {
                    module.init(container, db, auth, currentUserId);
                } else {
                    container.innerHTML = `<div style="color: #ff8585; text-align: center; padding: 40px;">
                        Le module <b>${nomModule}</b> ne possède pas de fonction <code>init()</code> valide.
                    </div>`;
                }
            } catch (error) {
                console.error(`Erreur lors du chargement de ${nomModule}:`, error);
                container.innerHTML = `<div style="color: #ff8585; text-align: center; padding: 40px;">
                    Échec du chargement du fichier <code>${filePath}</code>. Assurez-vous qu'il est présent sur le serveur.
                </div>`;
            }
        }

        // Attachement des événements de clic aux cartes du menu
        document.querySelectorAll('.nav-card').forEach(card => {
            card.addEventListener('click', function() {
                const moduleName = this.getAttribute('data-module');
                chargerModule(moduleName, this);
            });
        });

        // Gestion globale de l'état d'authentification
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("connexion.html");
                return;
            }

            currentUserId = user.uid;

            // Écoute temps réel des infos de l'utilisateur sous `users/{uid}`
            const userRef = ref(db, `users/${user.uid}`);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const nomComplet = `${data.prenom || ''} ${data.nom || ''}`.trim();
                    document.getElementById("userNameHeader").textContent = `👋 ${nomComplet || user.email.split('@')[0]}`;
                } else {
                    document.getElementById("userNameHeader").textContent = `👋 ${user.email.split('@')[0]}`;
                }
            });

            // Lancement initial du module Tableau de bord
            const defaultCard = document.querySelector('.nav-card[data-module="dashboard"]');
            chargerModule('dashboard', defaultCard);
        });

        // Gestion de la déconnexion
        document.getElementById("btnLogout").addEventListener("click", async () => {
            try {
                await signOut(auth);
                // La redirection vers connexion.html sera automatiquement déclenchée par onAuthStateChanged
            } catch (error) {
                console.error("Erreur lors de la déconnexion :", error);
            }
        });
    </script>
</body>
</html>
