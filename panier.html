<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#d4af37">
<meta name="application-name" content="DAKPRO ÉLITE">
<meta name="apple-mobile-web-app-title" content="DAKPRO ÉLITE">

<title>Mon Panier | DAKPRO ÉLITE</title>

<link rel="icon" type="image/png" href="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #d4af37;
  --black: #050505;
  --soft-dark: #12161f;
  --card: #1a2230;
  --green: #22c55e;
  --red: #ef4444;
  --white: #fff;
  --gray: #aaa;
  --border: rgba(212, 175, 55, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--black);
  color: var(--white);
  font-family: 'Poppins', sans-serif;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: linear-gradient(to bottom, #131921, #050505);
  border-bottom: 2px solid var(--gold);
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}

.btn-back {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* CONTAINER */
.container {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

.cart-items-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.cart-item-img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
  background: #080b10;
  flex-shrink: 0;
}

.cart-item-info {
  flex: 1;
  min-width: 0;
}

.cart-item-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cart-item-price {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.btn-qty {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-qty:active {
  background: var(--gold);
  color: #000;
}

.qty-val {
  font-size: 14px;
  font-weight: 600;
  min-width: 20px;
  text-align: center;
}

.btn-remove {
  background: transparent;
  border: none;
  color: var(--red);
  font-size: 20px;
  cursor: pointer;
  padding: 6px;
  margin-left: 8px;
}

.cart-summary {
  background: var(--soft-dark);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 16px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 14px;
}

.summary-row.total {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  margin-bottom: 20px;
}

.actions-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-checkout {
  width: 100%;
  padding: 14px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}

.btn-clear {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--red);
  border: 1px solid var(--red);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--gray);
}

.empty-state h3 {
  margin-bottom: 10px;
  color: #fff;
}

.btn-home {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background: var(--gold);
  color: #000;
  font-weight: 700;
  border-radius: 8px;
  text-decoration: none;
}
</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="btn-back">⬅️ Boutique</a>
  <h1 class="header-title">🛒 Votre Panier</h1>
  <div style="width: 60px;"></div>
</header>

<main class="container">
  <!-- LISTE DES ARTICLES -->
  <div id="cartList" class="cart-items-list">
    <div class="empty-state">Chargement du panier...</div>
  </div>

  <!-- RÉSUMÉ DU PANIER -->
  <div id="cartSummary" class="cart-summary" style="display: none;">
    <div class="summary-row">
      <span>Nombre d'articles :</span>
      <span id="totalItemsCount">0</span>
    </div>
    <div class="summary-row total">
      <span>Total à payer :</span>
      <span id="grandTotal">0 FCFA</span>
    </div>

    <div class="actions-group">
      <button type="button" class="btn-checkout" id="btnGoToPayment">💳 Aller au paiement</button>
      <button type="button" class="btn-clear" id="btnClearCart">🗑️ Vider le panier</button>
    </div>
  </div>
</main>

<!-- SCRIPT PANIER & REALTIME DATABASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
  authDomain: "dakproelite.firebaseapp.com",
  databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
  projectId: "dakproelite",
  storageBucket: "dakproelite.firebasestorage.app",
  messagingSenderId: "580591769206",
  appId: "1:580591769206:web:4f67f8aadbf3d051087157"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;

// Vérification de la connexion de l'utilisateur
onAuthStateChanged(auth, user => {
  if (!user) {
    document.getElementById("cartList").innerHTML = `
      <div class="empty-state">
        <h3>Vous n'êtes pas connecté</h3>
        <p>Veuillez vous connecter pour voir votre panier.</p>
        <a href="profil-acheteur.html" class="btn-home">Se connecter</a>
      </div>`;
    document.getElementById("cartSummary").style.display = "none";
    return;
  }

  currentUser = user;
  ecouterPanier(user.uid);
});

// Écoute en temps réel des modifications dans Realtime Database
function ecouterPanier(uid) {
  const cartRef = ref(db, `users/${uid}/panier`);

  onValue(cartRef, snapshot => {
    const data = snapshot.val();
    const cartList = document.getElementById("cartList");
    const cartSummary = document.getElementById("cartSummary");

    if (!data || typeof data !== "object" || Object.keys(data).length === 0) {
      cartList.innerHTML = `
        <div class="empty-state">
          <h3>Votre panier est vide 🛒</h3>
          <p>Découvrez nos offres sur la boutique !</p>
          <a href="index.html" class="btn-home">Explorer la boutique</a>
        </div>`;
      cartSummary.style.display = "none";
      return;
    }

    let itemsHTML = "";
    let totalArticles = 0;
    let grandTotal = 0;
    let mainCurrency = "FCFA";

    Object.entries(data).forEach(([productId, item]) => {
      const qty = parseInt(item.quantite || 1, 10);
      const price = parseFloat(item.prixUnitaire || 0);
      const itemTotal = qty * price;
      const currency = item.devise || "FCFA";
      mainCurrency = currency;

      totalArticles += qty;
      grandTotal += itemTotal;

      const imgUrl = item.image || "https://via.placeholder.com/70";

      itemsHTML += `
        <div class="cart-item" data-id="${productId}">
          <img src="${imgUrl}" alt="${item.nom || 'Produit'}" class="cart-item-img" onerror="this.src='https://via.placeholder.com/70'">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.nom || 'Produit'}</div>
            <div class="cart-item-price">${price} ${currency}</div>
            <div class="qty-controls">
              <button class="btn-qty btn-minus" data-id="${productId}" data-qty="${qty}" data-price="${price}">-</button>
              <span class="qty-val">${qty}</span>
              <button class="btn-qty btn-plus" data-id="${productId}" data-qty="${qty}" data-price="${price}">+</button>
            </div>
          </div>
          <button class="btn-remove" data-id="${productId}">🗑️</button>
        </div>
      `;
    });

    cartList.innerHTML = itemsHTML;
    document.getElementById("totalItemsCount").textContent = totalArticles;
    document.getElementById("grandTotal").textContent = `${grandTotal.toFixed(2)} ${mainCurrency}`;
    cartSummary.style.display = "block";

    attacherEvenements(uid);
  });
}

// Attachement des événements de mise à jour / suppression en temps réel dans Firebase
function attacherEvenements(uid) {
  // Bouton Plus +
  document.querySelectorAll(".btn-plus").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const newQty = parseInt(btn.dataset.qty, 10) + 1;
      const unitPrice = parseFloat(btn.dataset.price);

      update(ref(db, `users/${uid}/panier/${id}`), {
        quantite: newQty,
        total: parseFloat((newQty * unitPrice).toFixed(2)),
        updatedAt: Date.now()
      });
    });
  });

  // Bouton Moins -
  document.querySelectorAll(".btn-minus").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const currentQty = parseInt(btn.dataset.qty, 10);
      const unitPrice = parseFloat(btn.dataset.price);

      if (currentQty > 1) {
        const newQty = currentQty - 1;
        update(ref(db, `users/${uid}/panier/${id}`), {
          quantite: newQty,
          total: parseFloat((newQty * unitPrice).toFixed(2)),
          updatedAt: Date.now()
        });
      } else {
        remove(ref(db, `users/${uid}/panier/${id}`));
      }
    });
  });

  // Bouton Supprimer 🗑️
  document.querySelectorAll(".btn-remove").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      remove(ref(db, `users/${uid}/panier/${id}`));
    });
  });
}

// Vider tout le panier
document.getElementById("btnClearCart")?.addEventListener("click", () => {
  if (currentUser && confirm("Voulez-vous vraiment vider l'ensemble de votre panier ?")) {
    remove(ref(db, `users/${currentUser.uid}/panier`));
  }
});

// Redirection vers la page de paiement avec les données Firebase synchronisées
document.getElementById("btnGoToPayment")?.addEventListener("click", () => {
  window.location.href = "paiement.html";
});
</script>

</body>
</html>
