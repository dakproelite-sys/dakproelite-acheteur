<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#d4af37"
>

<title>Paiement | DAKPRO ÉLITE</title>

<link
  rel="icon"
  type="image/png"
  href="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png"
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
>


<style>

* {

  box-sizing:border-box;

}


html,
body {

  margin:0;

  min-height:100%;

}


body {

  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #151a24,
      #050505 55%
    );

  color:#fff;

  font-family:'Poppins',sans-serif;

}


.payment-header {

  position:sticky;

  top:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:13px 16px;

  background:
    linear-gradient(
      to bottom,
      #131921,
      #050505
    );

  border-bottom:2px solid #d4af37;

}


.payment-header a {

  color:#fff;

  text-decoration:none;

  font-size:13px;

}


.payment-header a:hover {

  color:#d4af37;

}


.payment-title {

  color:#d4af37;

  font-size:17px;

  font-weight:800;

}


.payment-container {

  width:100%;

  max-width:1050px;

  margin:0 auto;

  padding:20px 15px 40px;

}


#paymentModuleContainer {

  width:100%;

}


.loading-box {

  min-height:300px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#aaa;

}


.loading-spinner {

  width:42px;

  height:42px;

  border-radius:50%;

  border:3px solid #292d37;

  border-top-color:#d4af37;

  animation:
    dakSpin 1s linear infinite;

  margin-bottom:15px;

}


@keyframes dakSpin {

  to {

    transform:rotate(360deg);

  }

}


.error-box {

  background:#0a0d14;

  border:1px solid #ef4444;

  border-radius:12px;

  padding:25px;

  text-align:center;

  color:#ff8585;

}


.error-box h3 {

  color:#fff;

  margin:0 0 10px;

}


.error-box p {

  color:#aaa;

  font-size:13px;

  line-height:1.6;

}


.btn-return {

  display:inline-block;

  margin-top:15px;

  padding:10px 18px;

  border-radius:8px;

  background:#d4af37;

  color:#000;

  text-decoration:none;

  font-weight:700;

}


@media(max-width:600px) {

  .payment-title {

    font-size:15px;

  }

  .payment-header a {

    font-size:12px;

  }

}

</style>

</head>


<body>


<header class="payment-header">

  <a href="panier.html">
    ⬅️ Retour au panier
  </a>


  <div class="payment-title">
    🔒 Paiement sécurisé
  </div>


  <div style="width:60px;"></div>

</header>



<main class="payment-container">


  <div
    id="paymentModuleContainer"
  >

    <div class="loading-box">

      <div class="loading-spinner"></div>

      <div>
        Préparation de votre paiement...
      </div>

    </div>

  </div>


</main>



<script type="module">

/* ============================================================
   DAKPRO ÉLITE — paiement.html
   Charge paiement.js sans créer de page blanche
   ============================================================ */


const container =
  document.getElementById(
    "paymentModuleContainer"
  );


function showError(title, message) {

  container.innerHTML = `

    <div class="error-box">

      <h3>
        ${title}
      </h3>

      <p>
        ${message}
      </p>

      <a
        href="panier.html"
        class="btn-return"
      >
        ⬅️ Retour au panier
      </a>

    </div>

  `;

}


try {


  /* ========================================================
     1. CHARGER CONFIGURATION FIREBASE
     ======================================================== */

  const config =
    await import(
      "./firebase-config.js"
    );


  /* ========================================================
     2. RÉCUPÉRER APP / DB / AUTH
     ======================================================== */

  let app =
    config.app ||
    config.firebaseApp ||
    null;


  let db =
    config.db ||
    config.database ||
    null;


  let auth =
    config.auth ||
    null;


  /*
   * Si firebase-config.js exporte seulement app,
   * on construit db/auth à partir de cette app.
   */

  if (!db && app) {

    const firebaseDatabase =
      await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      );

    db =
      firebaseDatabase.getDatabase(
        app
      );

  }


  if (!auth && app) {

    const firebaseAuth =
      await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      );

    auth =
      firebaseAuth.getAuth(
        app
      );

  }


  if (!db || !auth) {

    throw new Error(
      "firebase-config.js ne fournit pas correctement Firebase."
    );

  }


  /* ========================================================
     3. ATTENDRE L'UTILISATEUR FIREBASE
     ======================================================== */

  const {
    onAuthStateChanged
  } =
    await import(
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
    );


  const user =
    await new Promise(
      resolve => {

        let resolved =
          false;


        const unsubscribe =
          onAuthStateChanged(
            auth,
            currentUser => {

              if (!resolved) {

                resolved =
                  true;

                unsubscribe();

                resolve(
                  currentUser
                );

              }

            }
          );

      }
    );


  if (!user) {

    showError(
      "Connexion nécessaire",
      "Vous devez être connecté pour accéder au paiement DAKPRO ÉLITE."
    );

    throw new Error(
      "Utilisateur non connecté."
    );

  }


  /* ========================================================
     4. CHARGER LE MODULE PAIEMENT
     ======================================================== */

  const paiementModule =
    await import(
      "./paiement.js"
    );


  if (
    !paiementModule ||
    typeof paiementModule.init !==
      "function"
  ) {

    throw new Error(
      "La fonction init() de paiement.js est introuvable."
    );

  }


  /* ========================================================
     5. INITIALISER LE PAIEMENT
     ======================================================== */

  paiementModule.init(
    container,
    db,
    auth,
    user.uid
  );


} catch (error) {

  console.error(
    "Erreur paiement.html :",
    error
  );


  /*
   * Ne jamais laisser une page blanche.
   */

  showError(
    "Impossible de charger le paiement",
    "Une erreur est survenue pendant l'ouverture de l'espace de paiement. Votre panier n'a pas été supprimé. Revenez au panier et réessayez."
  );

}

</script>

</body>

</html>
