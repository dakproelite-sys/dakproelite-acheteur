<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#d4af37">
<meta name="application-name" content="DAKPRO ÉLITE">
<meta name="apple-mobile-web-app-title" content="DAKPRO ÉLITE">

<title>Mon Panier | DAKPRO ÉLITE</title>

<link rel="icon" type="image/png"
href="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>
:root {
  --gold: #d4af37;
  --black: #050505;
  --soft-dark: #12161f;
  --card: #1a2230;
  --green: #22c55e;
  --red: #ef4444;
  --white: #fff;
  --gray: #aaa;
  --border: rgba(212, 175, 55, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--black);
  color: var(--white);
  font-family: 'Poppins', sans-serif;
  display: flex;
  flex-direction: column;
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: linear-gradient(to bottom, #131921, #050505);
  border-bottom: 2px solid var(--gold);
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}

.btn-back {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

.container {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

.cart-items-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.cart-item-img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
  background: #080b10;
  flex-shrink: 0;
}

.cart-item-info {
  flex: 1;
  min-width: 0;
}

.cart-item-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cart-item-price {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.btn-qty {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-weight: bold;
  cursor: pointer;
}

.qty-val {
  font-size: 14px;
  font-weight: 600;
  min-width: 20px;
  text-align: center;
}

.btn-remove {
  background: transparent;
  border: none;
  color: var(--red);
  font-size: 20px;
  cursor: pointer;
  padding: 6px;
}

.cart-summary {
  background: var(--soft-dark);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 16px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 14px;
}

.summary-row.total {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  margin-bottom: 20px;
}

.actions-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-checkout {
  width: 100%;
  padding: 14px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.btn-checkout:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.btn-clear {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--red);
  border: 1px solid var(--red);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--gray);
}

.empty-state h3 {
  margin-bottom: 10px;
  color: #fff;
}

.btn-home {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background: var(--gold);
  color: #000;
  font-weight: 700;
  border-radius: 8px;
  text-decoration: none;
}

.error-state {
  text-align: center;
  padding: 40px 20px;
  color: #ff7777;
}

@media (max-width: 500px) {

  .header-title {
    font-size: 15px;
  }

  .cart-item {
    padding: 9px;
  }

  .cart-item-img {
    width: 60px;
    height: 60px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="btn-back">
    ⬅️ Boutique
  </a>

  <h1 class="header-title">
    🛒 Votre Panier
  </h1>

  <div style="width:60px;"></div>

</header>


<main class="container">

  <div id="cartList" class="cart-items-list">

    <div class="empty-state">
      Chargement du panier...
    </div>

  </div>


  <div id="cartSummary"
       class="cart-summary"
       style="display:none;">

    <div class="summary-row">

      <span>Nombre d'articles :</span>

      <span id="totalItemsCount">
        0
      </span>

    </div>


    <div class="summary-row total">

      <span>Total à payer :</span>

      <span id="grandTotal">
        0 FCFA
      </span>

    </div>


    <div class="actions-group">

      <button
        type="button"
        class="btn-checkout"
        id="btnGoToPayment">

        💳 Aller au paiement

      </button>


      <button
        type="button"
        class="btn-clear"
        id="btnClearCart">

        🗑️ Vider le panier

      </button>

    </div>

  </div>

</main>


<script type="module" src="./panier.js"></script>

</body>
</html>
