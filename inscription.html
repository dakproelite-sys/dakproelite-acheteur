*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:20px;}
.box{width:100%;max-width:480px;padding:30px 25px;background:#12161f;border:2px solid #d4af37;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.logo{display:block;width:75px;height:75px;margin:0 auto 15px;border-radius:50%;border:2px solid #d4af37;object-fit:cover;}
h1{text-align:center;font-size:22px;color:#d4af37;margin-bottom:6px;}
.subtitle{text-align:center;color:#e0e0e0;font-size:13px;line-height:1.5;margin-bottom:20px;}
.notice{background:#2a2107;border:1px solid #d4af37;color:#f0e68c;padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:20px;text-align:center;line-height:1.4;}
label{display:block;font-size:12px;color:#ddd;margin-bottom:6px;}
input,select{width:100%;padding:13px;border:1px solid #444;border-radius:9px;background:#000;color:#fff;outline:none;font-size:14px;}
input:focus,select:focus{border-color:#d4af37;}
select option{background:#000;color:#fff;}
.field{margin-bottom:14px;}
.phone-row{display:grid;grid-template-columns:160px 1fr;gap:8px;}
.password-box{position:relative;}
.password-box input{padding-right:50px;}
.toggle-password{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:transparent;color:#d4af37;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.privacy-box{display:flex;align-items:flex-start;gap:10px;margin:15px 0;padding:12px;background:#080808;border:1px solid #333;border-radius:10px;}
.privacy-box input{width:18px;height:18px;min-width:18px;margin-top:1px;accent-color:#d4af37;cursor:pointer;}
.privacy-label{font-size:11px;line-height:1.5;color:#ccc;cursor:pointer;margin:0;}
.privacy-label a{color:#d4af37;text-decoration:none;font-weight:bold;}
button.submit{width:100%;padding:13px;border:none;border-radius:9px;background:#d4af37;color:#000;font-weight:bold;cursor:pointer;font-size:14px;}
button.submit:disabled{opacity:.6;cursor:not-allowed;}
.message{margin-top:15px;padding:10px;border-radius:8px;font-size:12px;display:none;text-align:center;line-height:1.5;}
.error{background:#351313;color:#ff8585;}
.success{background:#12351d;color:#70e090;}
.links{margin-top:20px;text-align:center;font-size:12px;}
.links a{color:#d4af37;text-decoration:none;}
.links div{margin-top:10px;}
</style>

  apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
  authDomain: "dakproelite.firebaseapp.com",
  databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
  projectId: "dakproelite",
  storageBucket: "dakproelite.firebasestorage.app",
  messagingSenderId: "580591769206",
  appId: "1:580591769206:web:859724d4b2dbf904087157"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

// Redirection vers l'accueil ou le catalogue une fois inscrit
const redirectTarget = "index.html";

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

document.querySelectorAll(".toggle-password").forEach(buttonToggle => {
  buttonToggle.addEventListener("click", () => {
    const input = document.getElementById(buttonToggle.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
    buttonToggle.textContent = input.type === "password" ? "👁️" : "🙈";
  });
});

let pageAlreadyLoaded = false;
onAuthStateChanged(auth, user => {
  if (pageAlreadyLoaded) return;
  pageAlreadyLoaded = true;
  if (user) {
    window.location.replace(redirectTarget);
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const countryCode = document.getElementById("countryCode").value;
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const passwordConfirm = document.getElementById("passwordConfirm").value;
  const privacyAccepted = document.getElementById("privacyAccepted").checked;

  if (!name || !phone || !email || !password || !passwordConfirm) {
    showMessage("Veuillez remplir tous les champs.");
    return;
  }
  if (!privacyAccepted) {
    showMessage("Veuillez accepter les règles de confidentialité.");
    return;
  }
  if (password !== passwordConfirm) {
    showMessage("Les deux mots de passe ne correspondent pas.");
    return;
  }

  const cleanPhone = phone.replace(/[^0-9]/g, "");
  button.disabled = true;
  button.textContent = "Création du compte...";
  message.style.display = "none";

  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    const user = credential.user;

    await updateProfile(user, { displayName: name });

    const now = Date.now();

    // Le rôle est définitivement fixé sur "acheteur"
    const userData = {
      uid: user.uid,
      nom: name,
      email: email,
      telephone: countryCode + cleanPhone,
      indicatif: countryCode,
      role: "acheteur",
      actif: true,
      createdAt: now,
      updatedAt: now
    };

    await set(ref(db, "users/" + user.uid), userData);

    showMessage("Compte créé avec succès !", "success");

    setTimeout(() => {
      window.location.replace(redirectTarget);
    }, 700);

  } catch (error) {
    console.error("Erreur Firebase :", error);
    let text = "Impossible de créer le compte.";
    if (error.code === "auth/email-already-in-use") text = "Cette adresse e-mail est déjà utilisée.";
    showMessage(text);
    button.disabled = false;
    button.textContent = "Créer mon compte Acheteur";
  }
});
</script>
</body>
</html>
