label{

input:focus, select:focus, textarea:focus{

.phone-container{

}

.phone-container select{

}

.phone-container input{

textarea{

  gap:8px;
  margin-top:10px;
  transition:background .2s, transform .1s;
}

.btn-whatsapp:hover{

}

.btn-whatsapp:active{

<script>
const ASSISTANT_WHATSAPP = "2290195593944";

document.getElementById("supportForm").addEventListener("submit", function(e){
  e.preventDefault();
  
  const name = document.getElementById("fullName").value.trim();
  const code = document.getElementById("countryCode").value;
  const phone = document.getElementById("phoneInput").value.trim();
  const msg = document.getElementById("supportMessage").value.trim();

  let text = `Bonjour Assistant DAKPRO ÉLITE,%0A%0A`;
  text += `*Nom & Prénom:* ${encodeURIComponent(name)}%0A`;
  text += `*Téléphone:* ${encodeURIComponent(code + " " + phone)}%0A`;
  text += `*Message:* ${encodeURIComponent(msg)}`;

  const waURL = `https://wa.me/${ASSISTANT_WHATSAPP}?text=${text}`;
  window.open(waURL, "_blank");
});
</script>
